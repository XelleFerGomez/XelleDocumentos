<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Xelle Lims - Acceso Seguro</title>
    <link rel="stylesheet" href="lims-theme.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div id="login-logo-place" class="login-logo"></div>
            
            <h2 class="login-title">XELLE SCIENTIFIC</h2>
            
            <form id="loginForm">
                <input type="text" id="txtUser" class="form-input" placeholder="Usuario" required>
                <input type="password" id="txtPass" class="form-input" placeholder="Contraseña" required>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <p id="errorMsg" class="error-msg"></p>
            </form>
            
            <div style="margin-top:30px; font-size:11px; color:#a0aec0;">
                Sistema de Gestión Integral V11.0
            </div>
        </div>
    </div>

    <div id="blockedModal" class="blocked-modal">
        <div class="blocked-content">
            <div class="blocked-icon">⚠️</div>
            <h3 class="blocked-title">ACCESO BLOQUEADO</h3>
            <p class="blocked-text">
                Se han detectado múltiples intentos fallidos de acceso.
                Por seguridad, su cuenta ha sido suspendida temporalmente.
            </p>
            <a href="mailto:soporte@xellescientific.com" class="btn-contact">Contactar Administración</a>
            <br><br>
            <button onclick="location.reload()" style="border:none; background:none; color:#999; cursor:pointer; font-size:12px;">Intentar de nuevo (Reset)</button>
        </div>
    </div>

    <script src="config-users.js"></script>
    <script src="lims-core.js"></script>

    <script>
        $(document).ready(function() {
            // 1. Inyectar Logo
            if(window.SeedData && window.SeedData.LOGO_SVG) {
                $('#login-logo-place').html(window.SeedData.LOGO_SVG);
            }

            // 2. Manejar Login
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                const u = $('#txtUser').val().trim();
                const p = $('#txtPass').val().trim();
                
                const res = window.Core.Auth.login(u, p);
                
                if (res.success) {
                    window.location.href = 'dashboard.html';
                } else {
                    if (res.status === 'blocked') {
                        // MOSTRAR POPUP REAL
                        $('#blockedModal').css('display', 'flex');
                    } else {
                        // MOSTRAR ERROR TEXTUAL ESPECÍFICO
                        $('#errorMsg').text(res.msg).slideDown();
                    }
                }
            });
        });
    </script>
</body>
</html>
