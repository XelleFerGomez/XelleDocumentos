<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - XELLE</title>
    <link rel="stylesheet" href="lims-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="wrapper">
    <nav class="sidebar">
        <div class="brand">
            <div id="sidebar-logo-place" class="brand-logo"></div>
            <span class="brand-text">XELLE LIMS</span>
        </div>
        <div id="menu-home" class="menu-item active" onclick="loadView('home')"><i class="fas fa-home"></i> Inicio</div>
        <div style="margin-top:25px; padding-left:25px; font-size:11px; color:#a0aec0; font-weight:800; letter-spacing:1px;">MÓDULOS</div>
        <div id="dynamic-menu"></div>
        <div style="margin-top:auto; border-top:1px solid rgba(255,255,255,0.1);"><div class="menu-item" onclick="Core.Auth.logout()"><i class="fas fa-sign-out-alt"></i> Salir</div></div>
    </nav>
    <div class="main-content">
        <header class="top-header">
            <div style="font-weight:800; color:var(--c-navy); font-size:18px;">Sistema de Gestión de Calidad</div>
            <div style="font-size:14px;"><span id="u-name" style="font-weight:700;"></span> <span id="u-role" style="background:var(--c-teal); color:white; padding:3px 8px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase;"></span></div>
        </header>
        <div id="workspace" class="workspace"></div>
    </div>
</div>
<script src="config-users.js"></script>
<script src="lims-core.js"></script>
<script>
    $(document).ready(function() {
        if(window.SeedData && window.SeedData.LOGO_SVG) $('#sidebar-logo-place').html(window.SeedData.LOGO_SVG);
    });
</script>
</body>
</html>
