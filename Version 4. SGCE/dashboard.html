<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - XELLE</title>
    <link rel="stylesheet" href="lims-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="wrapper">
    <nav class="sidebar">
        <div class="brand">
            <svg viewBox="10 10 80 80" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <style>
                    .svg-logo-celula { fill: #2E9D82; }
                    </style>
                </defs>
                <g>
                    <circle class="svg-logo-celula" cx="25" cy="25" r="13" />
                    <circle class="svg-logo-celula" cx="75" cy="75" r="13" />
                    <path class="svg-logo-celula" d="M 15.81,65.81 C 28.54,53.08 33.74,59.19 46.46,46.46 C 59.19,33.74 53.08,28.54 65.81,15.81 A 13 13 0 1 1 84.19,34.19 C 71.46,46.92 66.26,40.81 53.54,53.54 C 40.81,66.26 46.92,71.46 34.19,84.19 A 13 13 0 1 1 15.81,65.81 Z" />
                </g>
            </svg>
            <span class="brand-text">XELLE LIMS</span>
        </div>
        
        <div id="menu-home" class="menu-item active" onclick="loadView('home')">
            <i class="fas fa-home"></i> Inicio
        </div>
        
        <div style="margin-top:20px; padding-left:25px; font-size:11px; color:#7f8c8d; font-weight:bold; letter-spacing:1px;">MÓDULOS</div>
        <div id="dynamic-menu"></div>
        
        <div style="margin-top:auto; border-top:1px solid rgba(255,255,255,0.1);">
            <div class="menu-item" onclick="Core.Auth.logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </div>
        </div>
    </nav>

    <div class="main-content">
        <header class="top-header">
            <div style="font-weight:bold; color:#444;">Sistema de Gestión de Calidad</div>
            <div style="font-size:14px; color:#555;">
                Hola, <span id="u-name" style="font-weight:bold; color:#2c3e50;">Usuario</span> 
                <span id="u-role" style="background:#2c3e50; color:white; padding:2px 8px; border-radius:4px; font-size:10px; margin-left:5px;">ROL</span>
            </div>
        </header>

        <div id="workspace" class="workspace"></div>
    </div>
</div>

<script src="config-users.js"></script>
<script src="lims-core.js"></script>
</body>
</html>
