<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>XELLE LIMS - Acceso</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#2fa785",
                "background-light": "#f6f8f7",
                "xelle-navy": "#1E3A5F",
              },
              fontFamily: { "display": ["Manrope", "sans-serif"] },
            },
          },
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(47, 167, 133, 0.1);
        }
    </style>
</head>
<body class="bg-background-light font-display min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
    
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>

    <div class="w-full max-w-[480px] relative z-10">
        <div class="flex flex-col items-center mb-8">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-12 h-12">
                    <img src="assets/icono.svg" alt="Xelle Logo" class="w-full h-full object-contain">
                </div>
                <h1 class="text-xelle-navy text-3xl font-extrabold tracking-tight">XELLE <span class="text-primary">LIMS</span></h1>
            </div>
            <p class="text-xelle-navy/60 text-sm font-medium tracking-wide">Laboratory Information Management System v5.0</p>
        </div>

        <div class="glass-card rounded-xl p-8 md:p-10">
            <div class="mb-8">
                <h2 class="text-xelle-navy text-2xl font-bold mb-2">Bienvenido</h2>
                <p class="text-xelle-navy/50 text-sm">Ingrese sus credenciales para continuar</p>
            </div>

            <div id="loginError" class="hidden flex items-center gap-3 p-3 mb-6 bg-red-50 border border-red-100 rounded-lg">
                <span class="material-symbols-outlined text-red-500 text-[20px]">error</span>
                <p class="text-red-600 text-xs font-semibold uppercase">Usuario o contraseña incorrectos</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div class="flex flex-col gap-2">
                    <label class="text-xelle-navy text-sm font-bold uppercase ml-1">Usuario</label>
                    <input id="username" class="w-full h-14 px-4 bg-white/50 border border-gray-200 rounded-xl text-xelle-navy focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" placeholder="admin" type="text" required/>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-xelle-navy text-sm font-bold uppercase ml-1">Contraseña</label>
                    <input id="password" class="w-full h-14 px-4 bg-white/50 border border-gray-200 rounded-xl text-xelle-navy focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" placeholder="••••" type="password" required/>
                </div>

                <button class="w-full h-14 bg-primary hover:bg-primary/90 text-white font-bold text-lg rounded-xl shadow-lg transition-all flex items-center justify-center gap-2" type="submit">
                    <span>Ingresar</span>
                    <span class="material-symbols-outlined">login</span>
                </button>
            </form>
        </div>
    </div>

    <script src="js/config-users.js"></script>
    <script src="js/core/auth.js"></script>
</body>
</html>
